  :root{
    --panel:#15171a; --edge:#d9dde2;
    --blue:#4aa8d8; --blue-dark:#2f86b5; --red:#d8323a; --red-dark:#a8222a;
    --screen:#c9d8b6; --screen-ink:#1d2a14; --ghost:rgba(29,42,20,.13);
    --paper:#fffdf2; --paper-ink:#1b2a6b; --rule:rgba(70,110,190,.35); --margin:rgba(220,70,70,.6);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;height:100dvh;margin:0;overflow:hidden}
  body{
    background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;touch-action:manipulation;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  }
  #text{
    flex:1 1 0;min-height:0;width:100%;margin:0;border:0;border-radius:0;resize:none;outline:none;-webkit-user-select:none;user-select:none;caret-color:transparent;
    background:var(--screen);color:var(--screen-ink);
    padding:16px;font:700 18px/1.4 "DSEG7",ui-monospace,Menlo,Consolas,monospace;letter-spacing:0;
    box-shadow:inset 0 -4px 10px rgba(0,0,0,.25);
  }
  .pad{
    flex:1 1 0;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);
    gap:8px;padding:10px;
  }
  .key{
    min-height:0;border:0;border-radius:10px;color:#000;
    font:700 clamp(20px,4.8vh,30px) "DSEG7",system-ui,sans-serif;text-indent:.06em;--c:#9a9da3;--s:#686b71;background:var(--c);box-shadow:0 4px 0 var(--s);transition:transform .05s,box-shadow .05s;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
  }
  .key{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;line-height:1}
  .key .s{display:flex;align-items:center;justify-content:center;gap:3px;min-height:14px;font:600 9px/1 system-ui,-apple-system,sans-serif;text-indent:0;white-space:nowrap;opacity:.85}
  .key .s svg{display:block}
  .key:active,.key.down{transform:translateY(3px);box-shadow:0 1px 0 var(--s);filter:brightness(.7)}
  .key.ka{--c:#e5383b;--s:#9d1d20}
  .key.kb{--c:#ff9f1c;--s:#bf6f00}
  .key.kc{--c:#3fb950;--s:#237a31}
  .key.kd{--c:#3d8bfd;--s:#1f58b8}
  .key.kdash{--c:#ffd60a;--s:#a89000}
  .key.kdot{--c:#b45cff;--s:#7a2fc2}
  .key:focus-visible{outline:3px solid #fff;outline-offset:2px}
  #text{white-space:pre;overflow:auto;display:block}
  .top{flex:2 1 0;min-height:0;display:flex;flex-direction:column}
  #sub{
    flex:1 1 0;min-height:0;overflow-y:auto;white-space:pre-wrap;overflow-wrap:anywhere;
    background-color:var(--paper);color:var(--paper-ink);
    background-image:
      linear-gradient(to right,transparent 38px,var(--margin) 38px,var(--margin) 40px,transparent 40px),
      linear-gradient(to bottom,transparent 33px,var(--rule) 33px,var(--rule) 34px);
    background-size:100% 100%,100% 34px;background-attachment:local,local;
    font:500 19px/28px "Bradley Hand","Segoe Print","Comic Sans MS",cursive,system-ui,sans-serif;
    padding:0 16px 0 50px;border-top:3px solid var(--panel);
  }
  #inner{position:relative;display:inline-block;min-width:100%}
  #ghost{position:absolute;left:0;top:0;color:var(--ghost);pointer-events:none}
  #fg{position:relative}
  .cursor{display:inline-block;width:.618em;height:.124em;margin:0 .223em 0 .099em;background:var(--screen-ink);vertical-align:baseline;clip-path:polygon(0 50%,10% 0,90% 0,100% 50%,90% 100%,10% 100%);animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.key{transition:none}.cursor{animation:none}}
</style>
<style>
  :root{color-scheme:dark light;--panel:#070912;--screen:#05070f;--screen-ink:#fff;--ghost:rgba(255,255,255,.10);--paper:#0a0d18;--paper-ink:#bfe8ff;--rule:rgba(255,255,255,.12);--margin:rgba(255,59,92,.55)}
  body{background:var(--panel)}
  #text{border-radius:0;box-shadow:inset 0 -1px 0 rgba(255,255,255,.22);border-bottom:1px solid rgba(255,255,255,.22)}
  #fg{text-shadow:0 0 8px currentColor,0 0 20px currentColor}
  #acc{flex:none;display:flex;flex-direction:column;min-height:0}
  #acc.open{flex:1 1 0}
  #accH{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-top:1px solid rgba(255,255,255,.22);background:var(--paper);color:var(--screen-ink);font:700 11px/1 system-ui,sans-serif;letter-spacing:.18em;padding:11px 16px}
  #accH .chev{transition:transform .2s}
  #acc.open #accH .chev{transform:rotate(180deg)}
  #sub{display:none;border-top:0;font:500 22px/34px system-ui,-apple-system,sans-serif}
  #acc.open #sub{display:block;flex:1 1 0}
  .pad{background:var(--panel);gap:9px;padding:10px 12px}
  .pad .key{--c:#aab4d4;border:1.5px solid var(--c);border-radius:10px;background:var(--c);color:#10131c;box-shadow:none;text-shadow:none}
  .key::before{content:"";position:absolute;inset:4px;border:1.5px dotted rgba(0,0,0,.35);border-radius:7px;pointer-events:none}
  .pad .key.ka{--c:#ff3b5c}.pad .key.kb{--c:#ff9f1c}.pad .key.kc{--c:#2cff7a}.pad .key.kd{--c:#2f9bff}.pad .key.kdot{--c:#c25cff}.pad .key.kdash{--c:#ffff00}
  body:not(.muted) .pad .key{box-shadow:0 0 12px var(--c),0 0 28px color-mix(in srgb,var(--c) 70%,transparent),0 0 48px color-mix(in srgb,var(--c) 35%,transparent),inset 0 0 12px rgba(255,255,255,.35)}
